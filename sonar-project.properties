# SonarQube 分析配置（CI 扫描读本文件；Automatic Analysis 不读它，且与 CI 扫描互斥）
#
# projectKey / organization 与 SonarCloud「已导入」项目逐字一致：
#   https://sonarcloud.io/project/overview?id=lcy362_free-short-video-studio
#   （实测：sonar_api.py find lcy362/free-short-video-studio → key=lcy362_free-short-video-studio org=sandgrid）
sonar.projectKey=lcy362_free-short-video-studio
sonar.organization=sandgrid
sonar.projectName=free-short-video-studio
sonar.sourceEncoding=UTF-8

# 源码根：业务源码三目录（functions/ 为 Cloudflare Pages Function 运行时，不在浏览器源码域，不纳入）
sonar.sources=app,components,studio-core

# 测试代码单独声明，既计入「测试」统计，又不进覆盖率分母
sonar.tests=tests
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx

# 构建产物 / 依赖 / 覆盖率输出 / 测试文件都不参与源码分析
sonar.exclusions=\
  **/node_modules/**,\
  **/out/**,\
  **/.next/**,\
  **/coverage/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.d.ts,\
  studio-core/messages/**,\
  sonar-project.properties

# 覆盖率：单包仓库，vitest 产出仓库根相对路径的 lcov，与 sonar.sources 精确对齐
sonar.javascript.lcov.reportPaths=\
  coverage/lcov.info

# 覆盖率排除：装配 / 页面入口 / 浏览器深度绑定，无法被单测有意义覆盖。
# 必须与 vitest.config.ts 的 coverage.exclude 保持一致——lcov 里没有、
# 但参加了源码分析的文件，会被 Sonar 判成 0% 覆盖，把总覆盖率拉下来。
sonar.coverage.exclusions=\
  app/layout.tsx,\
  app/page.tsx,\
  components/StudioLanding.tsx,\
  studio-core/StudioClient.tsx,\
  studio-core/lib/ffmpeg-service.ts,\
  studio-core/messages/**

# 重复检测（CPD）排除：i18n 生成物结构同构、仅文案不同，必然被判重复
sonar.cpd.exclusions=\
  studio-core/messages/**

# 规则级屏蔽：只对「这条规则对该路径永远无意义」的两处生效，理由写在下面，
# 不要拿它当「一键消警」——其余问题一律改代码。
#  e1) typescript:S4084 —— <video> 必须带 <track kind="captions">。
#      本工程播放的**全部**是 AI 现场生成的短片（上游产物 + 浏览器内 ffmpeg 拼接结果），
#      既没有字幕来源，也没有上传字幕的入口，这条规则对 studio-core 的预览组件永远无意义。
#  e2) css:S9423 —— 禁止 !important。
#      app/globals.css 里唯一一处 !important 是 prefers-reduced-motion 的 `*` 重置
#      （animation / transition / scroll-behavior）。`*` 特异性为 0，去掉 !important
#      就会被 Tailwind 的 animate-* / transition-* 工具类覆盖，无障碍降级直接失效。
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S4084
sonar.issue.ignore.multicriteria.e1.resourceKey=studio-core/**/*.tsx
sonar.issue.ignore.multicriteria.e2.ruleKey=css:S9423
sonar.issue.ignore.multicriteria.e2.resourceKey=app/globals.css

# 注意：不要在这里写 sonar.token / sonar.login。令牌走 CI 的仓库 secret
# （SONAR_TOKEN），明文入库既是安全问题，也会让令牌随公开仓库泄露。
